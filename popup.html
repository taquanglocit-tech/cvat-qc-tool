<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CVAT 3D QC Master Tool</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --border: #303030;
      --text: #d9d9d9;
      --text-muted: #8c8c8c;
      --primary: #177ddc;
      --primary-hover: #1668b5;
      --success: #49aa19;
      --danger: #d32029;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding: 16px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .header-icon {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .origin-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .origin-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .origin-value {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: #fff;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 8px;
    }
    .status-badge.active { color: var(--success); }
    .status-badge.inactive { color: var(--text-muted); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    button:hover:not(:disabled) {
      background: #262626;
      border-color: var(--primary);
      color: #fff;
    }
    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
      <line x1="8" y1="21" x2="16" y2="21"></line>
      <line x1="12" y1="17" x2="12" y2="21"></line>
    </svg>
    <div class="header-title">CVAT 3D QC Master</div>
  </div>

  <div class="origin-box">
    <div class="origin-label">Domain CVAT hiện tại</div>
    <div class="origin-value" id="originText">Đang kiểm tra...</div>
    <div class="status-badge inactive" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusLabel">Chưa kích hoạt</span>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="toggleBtn" disabled>Kích hoạt trên domain này</button>
    <button id="injectBtn" style="display: none;">Chạy lại ngay trên tab này</button>
  </div>

  <div class="footer">Công cụ hỗ trợ kiểm định chất lượng gán nhãn 3D</div>

  <script src="register.js"></script>
  <script src="popup.js"></script>
</body>
</html>
